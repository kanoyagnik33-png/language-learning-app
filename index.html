
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Language World</title>
<style>
body{font-family:Arial;background:#effaf0;text-align:center;padding:20px;color:#17452b}
main{max-width:430px;margin:auto;background:white;padding:22px;border-radius:22px}
button,select{width:100%;padding:14px;margin:7px 0;border:0;border-radius:12px;font-size:17px}
button{background:#38a852;color:white}
.option{background:#e7f5e9;color:#17452b}
</style>
</head>
<body>
<main>
<h1>🌍 Language World</h1>
<p>રમતાં રમતાં નવી ભાષાઓ શીખો!</p>
<select id="lang" onchange="start()">
<option value="en">English</option>
<option value="hi">Hindi</option>
<option value="es">Spanish</option>
<option value="fr">French</option>
</select>
<h3 id="q"></h3>
<div id="answers"></div>
<p id="msg">ચાલો, શરૂ કરીએ!</p>
<p>⭐ Points: <span id="score">0</span></p>
<button onclick="start()">આગળનો પ્રશ્ન →</button>
</main>
<script>
const data={
en:[
["'Hello' નો અર્થ?",["નમસ્તે","પાણી","આભાર"],0],
["'Water' નો અર્થ?",["ઘર","પાણી","પુસ્તક"],1],
["'Thank you' નો અર્થ?",["આવજો","માફ કરશો","આભાર"],2]],
hi:[
["'नमस्ते' નો અર્થ?",["નમસ્તે","પાણી","ઘર"],0],
["'पानी' નો અર્થ?",["પુસ્તક","પાણી","આભાર"],1]],
es:[
["'Hola' નો અર્થ?",["આવજો","નમસ્તે","પાણી"],1],
["'Gracias' નો અર્થ?",["આભાર","ઘર","પુસ્તક"],0]],
fr:[
["'Bonjour' નો અર્થ?",["નમસ્તે","પાણી","આવજો"],0],
["'Merci' નો અર્થ?",["ઘર","આભાર","પુસ્તક"],1]]
};
let n=0,score=0,done=false;
function start(){
let arr=data[document.getElementById('lang').value];
let item=arr[n%arr.length];n++;done=false;
document.getElementById('q').textContent=item[0];
document.getElementById('msg').textContent='સાચો જવાબ પસંદ કરો';
let box=document.getElementById('answers');box.innerHTML='';
item[1].forEach((a,i)=>{
let b=document.createElement('button');b.className='option';b.textContent=a;
b.onclick=()=>{
if(done)return;done=true;
if(i===item[2]){score+=10;document.getElementById('score').textContent=score;document.getElementById('msg').textContent='સાચો જવાબ! 🎉 +10'}
else{document.getElementById('msg').textContent='ફરી પ્રયાસ કરો!'}
};box.appendChild(b);
});
}
start();
</script>
</body>
</html>
